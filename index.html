<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pong Game</h1>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="info">
            <p>Player 1 (Left): <span id="score1">0</span></p>
            <p>Player 2 (Right): <span id="score2">0</span></p>
        </div>
        <div class="controls">
            <p><strong>Player 1:</strong> W/S keys to move</p>
            <p><strong>Player 2:</strong> Up/Down arrow keys to move</p>
            <p><strong>Space:</strong> Start/Pause game</p>
            <p><strong>R:</strong> Reset game</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
